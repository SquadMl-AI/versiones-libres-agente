name: Backend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  duplication:
    name: Duplicate Code Check
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jscpd
        run: npm install -g jscpd

      - name: Check duplicated code
        # jscpd v4+ utiliza el directorio directamente. 
        # --threshold 0 hará que el job falle si hay cualquier duplicado.
        run: |
          jscpd . \
            --languages python \
            --min-lines 8 \
            --min-tokens 80 \
            --threshold 0 \
            --reporters console,checkstyle \
            --ignore "**/tests/**,**/venv/**,**/migrations/**"

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: duplication

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pip-audit

      - name: Run tests with coverage threshold
        # --cov-fail-under=70 detiene el pipeline si la cobertura es menor al 70%
        # Asegúrate de que 'app' sea el nombre correcto de tu carpeta de código fuente
        run: |
          pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70
