name: Backend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff lint
        run: |
          ruff check .

      - name: Ruff format check
        run: |
          ruff format --check .

  duplication:
    name: Duplicate Code Check
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jscpd
        run: |
          npm install -g jscpd

      - name: Create jscpd config
        run: |
          cat > .jscpd.ci.json << 'EOF'
          {
            "path": ["app"],
            "formats": ["python"],
            "minLines": 8,
            "minTokens": 80,
            "threshold": 2,
            "reporters": ["console"],
            "ignore": [
              "**/tests/**",
              "**/venv/**",
              "**/.venv/**",
              "**/migrations/**",
              "**/__pycache__/**",
              "**/.pytest_cache/**",
              "**/node_modules/**",
              "**/jscpd-report/**"
            ]
          }
          EOF

      - name: Check duplicated code
        run: |
          jscpd --config .jscpd.ci.json

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: duplication

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pip-audit

      - name: Run tests with coverage threshold
        run: |
          pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70