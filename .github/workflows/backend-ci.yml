name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-sonar:
    name: Lint, Test, Coverage, SonarQube
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    env:
      AZURE_BLOB_STORAGE_CONNECTION_STRING: "test"
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: "https://test"
      AZURE_OPENAI_ENDPOINT: "https://test"
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "test_db"
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_password"
      COSMOS_DB_ENDPOINT: "https://test-cosmos.documents.azure.com:443/"
      COSMOS_DB_KEY: "test"
      ELASTICSEARCH_HOST: "http://localhost:9200"
      ELASTICSEARCH_USER: "test"
      ELASTICSEARCH_PASSWORD: "test"
      SECRET_KEY: "test-secret"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests with coverage
        run: |
          pytest -q --cov=. --cov-report=xml --cov-report=term-missing

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=memorias975-backend
            -Dsonar.projectName=memorias975-backend
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/__pycache__/**,**/*.pyc,**/.venv/**,**/venv/**