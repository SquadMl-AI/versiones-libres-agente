name: Backend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    # Variables ficticias para entorno de pruebas
    env:
      AZURE_BLOB_STORAGE_CONNECTION_STRING: "test"
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: "https://test"
      AZURE_OPENAI_ENDPOINT: "https://test"
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "test_db"
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_password"
      COSMOS_DB_ENDPOINT: "https://test-cosmos.documents.azure.com:443/"
      COSMOS_DB_KEY: "test"
      ELASTICSEARCH_HOST: "http://localhost:9200"
      ELASTICSEARCH_USER: "test"
      ELASTICSEARCH_PASSWORD: "test"
      SECRET_KEY: "test-secret"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt flake8 pytest pytest-cov
          fi

      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests with coverage
        run: |
          pytest -q --cov=. --cov-report=term-missing