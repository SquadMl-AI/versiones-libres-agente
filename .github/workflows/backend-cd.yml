name: Backend CD

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # Selección dinámica del entorno según la rama
    environment: ${{ github.ref_name == 'main' && 'env_prod' || 'env_dev' }}

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Log in to Azure Container Registry
        # Usamos ACR_NAME que debe estar en los 'Variables' del entorno
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and Push Docker image
        run: |
          # Imagen dinámica basada en el SHA del commit
          IMAGE_PATH="${{ vars.ACR_LOGIN_SERVER }}/memorias975-backend:${{ github.sha }}"
          
          docker build -t $IMAGE_PATH .
          docker push $IMAGE_PATH
          
          # Guardar el path para el siguiente paso
          echo "DEPLOY_IMAGE=$IMAGE_PATH" >> $GITHUB_ENV

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          containerAppName: ${{ vars.ACA_NAME }}
          imageToDeploy: ${{ env.DEPLOY_IMAGE }}
          acrName: ${{ vars.ACR_NAME }}